name: Refresh activity

on:
  schedule:
    - cron: "17 2 * * *" # daily, 07:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # kaggle 1.8+ reads new API tokens from KAGGLE_API_TOKEN. It imports six without declaring it.
      - run: pip install "kaggle>=1.8,<2" six

      - name: Fetch GitHub and Kaggle activity
        run: python scripts/fetch_activity.py
        env:
          # A fine-grained token with no extra permissions works if GITHUB_TOKEN is refused.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          KAGGLE_USERNAME: raunakdey07
          # A new-style token is used as KAGGLE_API_TOKEN; a legacy key falls back to KAGGLE_KEY.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_API }}

      - name: Commit if the data changed
        run: |
          git diff --quiet -- assets/activity.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.json
          git commit -m "chore: refresh activity data"
          git push
