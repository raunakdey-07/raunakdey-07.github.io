name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Page checks
        run: node tests/check.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Activity script compiles
        run: python -m py_compile scripts/fetch_activity.py
